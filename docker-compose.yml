services:

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    image: jenkins:latest
    container_name: jenkins

    restart: unless-stopped

    group_add:
      - "0"
      
    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkinsData:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      TZ: Asia/Manila

    networks:
      - cicdNetwork


  sonarqube:
    image: sonarqube:community
    container_name: sonarqube

    restart: unless-stopped

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: C@m3l

    ports:
      - "9000:9000"

    volumes:
      - sonarData:/opt/sonarqube/data
      - sonarExtensions:/opt/sonarqube/extensions
      - sonarLogs:/opt/sonarqube/logs
      - sonarTemp:/opt/sonarqube/temp

    networks:
      - cicdNetwork


networks:
  cicdNetwork:
    name: cicdNetwork


volumes:
  jenkinsData:
    name: jenkinsData

  sonarData:
    name: sonarData
  sonarExtensions:
    name: sonarExtensions
  sonarLogs:
    name: sonarLogs
  sonarTemp:
    name: sonarTemp